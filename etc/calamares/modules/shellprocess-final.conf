i18n:
     name: "Finalizing your LimaLinux installation"

dontChroot: false
timeout: 120
script:
    # Remove live-only Calamares autostart from the installed system
    - command: "rm -f /etc/skel/.config/autostart/calamares.desktop"
      timeout: 10
    # Remove Calamares installer from the installed system's applications menu
    - command: "rm -f /usr/share/applications/cal_limalinux.desktop"
      timeout: 10
    # Update icon cache
    - command: "gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true"
      timeout: 30
    # Refresh font cache
    - command: "fc-cache -f || true"
      timeout: 30

