efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    2000MiB
    minimumSize:        32MiB
    label:              "EFI"

# Más de una opción: Calamares muestra un desplegable (swap pequeño, hibernar, archivo, ninguno).
# Ver ayuda en el módulo partition de Calamares: tamaños de *small* y *suspend*.
userSwapChoices:
    - none
    - small
    - suspend
    - file

swapPartitionName:      swap

luksGeneration: luks1

drawNestedPartitions:   false

alwaysShowPartitionLabels: true

initialPartitioningChoice: none

initialSwapChoice: none

#defaultFileSystemType:  "ext4"
defaultFileSystemType:  "btrfs"

#availableFileSystemTypes:  ["ext4"]
availableFileSystemTypes:  ["btrfs","ext4"]

# Mostrar opción de cifrado LUKS en el particionado automático.
enableLuksAutomatedPartitioning:    true

lvm:
    enable: false
